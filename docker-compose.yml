version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Geospatial Engine
  db:
    image: postgis/postgis:16-3.4
    container_name: ertmac-nwis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ertmac_secret}
      POSTGRES_DB: ${DB_NAME:-ertmac_nwis}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI AI & ML Decision-Support Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ertmac-nwis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-ertmac_secret}@db:5432/${DB_NAME:-ertmac_nwis}
      - PROJECT_NAME=eRTMAC-NWIS
      - DEFAULT_ACTIVE_WELL_ID=OIL-W102
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models

  # 3. React Vite UI Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ertmac-nwis-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
